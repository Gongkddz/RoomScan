name: 问题反馈
description: 报告采集、同步、重建或浏览问题
body:
  - type: textarea
    attributes:
      label: 环境与版本
      description: 应用版本、手机型号、Android 版本、电脑系统及 GPU。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果与脱敏日志
      description: 请删除配对码、凭证、设备身份和私人场景信息。
