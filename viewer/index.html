<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>探索空间</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;background:#101721;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;touch-action:none}button,select{border:1px solid #ffffff24;background:#172536bd;color:#f3f6fa;backdrop-filter:blur(14px);border-radius:15px;font:inherit;font-size:12px;touch-action:none}button{min-height:44px;padding:10px 15px}button:active,.pressed{background:#4875f0db;box-shadow:0 0 24px #4679ff55}.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.top>div{display:flex;align-items:center;gap:8px}.top button{pointer-events:auto}.title{font-size:14px;font-weight:600;text-shadow:0 2px 10px #000}.pill{font-size:11px;color:#d0d9e8;padding:8px 11px;border:1px solid #ffffff18;border-radius:22px;background:#18233494}.offline{font-size:9px;color:#9de4d0;letter-spacing:1px;margin-left:6px}#move-zone{position:fixed;left:0;bottom:0;width:46%;height:42%;max-height:310px;touch-action:none}#stick{position:fixed;left:104px;top:calc(100% - 120px);transform:translate(-50%,-50%);width:164px;height:164px;border:1px solid #ffffff38;border-radius:50%;background:radial-gradient(circle,#15283b25 35%,#23374b73);display:grid;place-items:center;pointer-events:none;opacity:.6;transition:opacity .12s}#stick:before{content:'';position:absolute;inset:13px;border:1px dashed #ffffff25;border-radius:50%}#stick.engaged{opacity:1;border-color:#c4d8ffad;box-shadow:0 0 35px #3a6ca92e}#stick.full-speed{border-color:#82baff;box-shadow:0 0 24px #538dff46}#knob{width:58px;height:58px;background:linear-gradient(150deg,#e6f0ffcf,#9aafc4a3);border:1px solid #f1f6ffe0;border-radius:50%;box-shadow:0 3px 15px #0004}.axis{position:absolute;font-size:10px;color:#d0d9e8}.north{top:8px}.south{bottom:8px}.west{left:10px}.east{right:10px}.move-help{position:fixed;left:24px;bottom:max(20px,env(safe-area-inset-bottom));font-size:10px;color:#d3deecba;pointer-events:none;text-shadow:0 1px 8px #000}.actions{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(65px,env(safe-area-inset-bottom));display:flex;gap:14px}.actions button{width:72px;height:72px;border-radius:50%;padding:0;display:grid;place-content:center;gap:1px;background:radial-gradient(circle at 35% 20%,#476078c9,#152a3cd9);border-color:#d5e7ff6b;box-shadow:0 4px 18px #0004}.actions button.pressed{background:#3963ebd9}.actions b{font-size:29px;line-height:32px;font-weight:400}.actions small{font-size:10px;color:#e1eafb}#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:10px;color:#e0e7f1c9;white-space:nowrap;text-shadow:0 1px 8px #000;pointer-events:none;display:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#101721;z-index:5;font-size:14px;color:#c4d2e5}#loading span{font-size:11px;color:#7f93ad;margin-top:12px}.pulse{margin:0 auto 22px;width:32px;height:32px;border:2px solid #395179;border-top-color:#9de4d0;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}dialog{color:#edf3fc;background:#172334f5;border:1px solid #ffffff25;border-radius:22px;padding:22px;width:calc(100% - 38px);max-width:420px;max-height:calc(100% - 30px);overflow:auto}dialog::backdrop{background:#0008}dialog h2{font-size:19px;margin:0 0 12px}label{font-size:13px;display:block;margin:16px 0 7px}input[type=range],select{width:100%;min-height:36px}select{padding:10px}small{font-size:11px;color:#a9b8ce;display:block;line-height:1.7}.row{display:flex;gap:10px}.row button{flex:1}#close-settings{width:100%;background:#3963eb;margin-top:16px}#scene-reset{margin-top:14px;width:100%}
@media(orientation:landscape){.top{top:max(12px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right))}#move-zone{width:44%;height:65%;max-height:290px}#stick{width:184px;height:184px;left:132px;top:calc(100% - 116px)}#knob{width:64px;height:64px}.actions{right:max(35px,env(safe-area-inset-right));bottom:48px;gap:22px}.actions button{width:80px;height:80px}.actions b{font-size:32px}#hint{display:block}.move-help{bottom:20px;left:55px}dialog{max-width:580px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}.title{font-size:15px}}
@media(max-width:440px)and(orientation:portrait){.title{display:none}.offline{display:none}.top{left:14px;right:14px;gap:5px}.top>div{gap:5px}.top button{padding:10px 12px}.pill{padding:8px}.move-help{max-width:165px}.actions{right:20px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","spark":"./vendor/spark.module.js","three/addons/postprocessing/Pass.js":"./vendor/Pass.js"}}</script></head><body>
<div id="loading"><div class="pulse"></div>正在打开空间<span>模型保存在手机，浏览无需联网</span></div>
<div class="top"><div><button id="back" aria-label="返回">‹ 返回</button><span class="title">探索空间<span class="offline">离线</span></span><span id="scene-scale" class="pill">1.00×</span></div><div><button id="orientation">横屏</button><button id="reset">回到起点</button><button id="settings-button" aria-label="操作设置">设置</button></div></div>
<div id="move-zone" aria-label="左下区域浮动摇杆"><div id="stick"><span class="axis north">前</span><span class="axis south">后</span><span class="axis west">左</span><span class="axis east">右</span><div id="knob"></div></div></div>
<div class="move-help">左下任意按住 · 推远加速</div>
<div class="actions"><button id="up" aria-label="上升"><b>↑</b><small>上升</small></button><button id="down" aria-label="下降"><b>↓</b><small>下降</small></button></div>
<div id="hint">单指转向 · 双指旋转 / 缩放 · 三指平移</div>
<dialog id="settings"><h2>探索操作</h2><small>左下按下生成摇杆，轻推细调、推远加速；右下长按升降。画面单指转向，双指旋转和缩放，三指平移场景。横竖屏切换保留当前位置。</small><div class="settings-grid"><div><label>移动方式</label><select id="mode"><option value="fly">自由飞行 · 完整六自由度</option><option value="walk">地面行走 · 水平移动</option></select><label>移动速度</label><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"></div><div><label>转向灵敏度</label><input id="sensitivity" type="range" min="0.001" max="0.006" step="0.0002" value="0.003"><label>镜头倾转</label><div class="row"><button id="roll-left">↶ 向左</button><button id="roll-right">向右 ↷</button></div></div></div><button id="scene-reset">重置场景旋转、缩放与平移</button><button id="close-settings">完成</button></dialog>
<script src="./bootstrap.js"></script><script type="module" src="./vendor/app.js"></script></body></html>
