<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留境 · 电脑工作台</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#16233a;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:36px 30px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.brand{font-size:25px;font-weight:700;letter-spacing:.5px}.brand span{font-size:11px;letter-spacing:2px;color:#8a97ad;margin-left:18px}.online{font-size:12px;background:#e5f4ed;color:#2c8461;padding:9px 14px;border-radius:30px}.online:before{content:'●';margin-right:7px;font-size:9px}h1{font-size:34px;letter-spacing:-1px;margin:0 0 12px}p{font-size:14px;color:#78859b;line-height:1.8;margin:0}section{margin-top:28px;display:grid;grid-template-columns:1.4fr 1fr;gap:22px}.card{background:white;border:1px solid #e9edf5;border-radius:24px;padding:28px}.pair{background:linear-gradient(145deg,#e7efff,#ebf7f0);border:0;display:flex;flex-direction:column;align-items:center;text-align:center}.kicker{font-size:11px;color:#7186ad;font-weight:600;letter-spacing:2px}.pair h2{font-size:23px;margin:12px 0 8px}.qr{margin:22px 0 14px;background:white;padding:12px;border-radius:18px;width:248px;height:248px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px #466caa10}.qr img{width:100%;height:100%}.hint{font-size:12px;color:#72839c}button{font:inherit;font-size:13px;border:0;background:white;color:#3963eb;border-radius:11px;padding:11px 18px;cursor:pointer;margin-top:16px}h2{font-size:18px;margin:0 0 18px}.row{display:flex;gap:13px;align-items:center;border-top:1px solid #f0f3f8;padding:17px 0}.icon{background:#edf2fc;border-radius:13px;width:43px;height:43px;display:grid;place-items:center;color:#3963eb;font-size:22px}.row b{font-size:14px;display:block;margin-bottom:4px}.row small{color:#8a97ab;font-size:12px}.stat{display:flex;gap:30px;margin-top:25px}.stat strong{font-size:32px;font-weight:600;display:block}.stat small{font-size:12px;color:#8a97ab}.notice{padding:16px 18px;background:#f7f9fd;border-radius:14px;margin-top:22px;font-size:12px;color:#7b889d;line-height:1.8}.wide{grid-column:1/-1}.empty{padding:20px 0;color:#8793a8;font-size:13px}footer{font-size:11px;color:#9aa6b8;text-align:center;margin-top:30px}@media(max-width:740px){section{grid-template-columns:1fr}main{padding:24px 18px}header{margin-bottom:30px}h1{font-size:27px}}
</style></head><body><main><header><div class="brand">◈ 留境 <span>ROOMSCAN</span></div><div class="online">电脑服务已启动</div></header><h1>把空间，交给留境。</h1><p>手机负责记录，电脑协助处理。你的数据保存在自己的设备。</p><section><div class="card pair"><div class="kicker">CONNECT YOUR PHONE</div><h2>扫码连接，之后自动重连</h2><p>打开手机「留境」→ 设备 → 扫描电脑配对码</p><div class="qr"><img id="qr" alt="手机配对二维码"></div><div class="hint" id="expiry">正在准备配对码…</div><button id="renew">刷新配对码</button></div><div class="card"><h2>设备与存储</h2><div id="devices" class="empty">等待手机连接</div><div class="stat"><div><strong id="count">0</strong><small>空间记录</small></div><div><strong id="deviceCount">0</strong><small>已配对设备</small></div></div><div class="notice">录制视频默认保存在手机，仅同步精选视角。模型本地缓存后可离线浏览。<br>当前版本已接通采集与同步，自动重建和三维浏览仍在开发。</div></div><div class="card wide"><h2>处理任务</h2><div id="jobs" class="empty">扫描记录同步后，将出现在这里。</div></div></section><footer>本地优先 · 自动发现 · 按需计算</footer></main><script>
const $=id=>document.getElementById(id);let showing=false;
async function refresh(){try{const s=await(await fetch('/api/status')).json();$('count').textContent=s.projects;$('deviceCount').textContent=s.devices.length;
$('devices').replaceChildren();if(!s.devices.length)$('devices').textContent='等待手机连接';for(const d of s.devices){const row=document.createElement('div');row.className='row';const icon=document.createElement('div');icon.className='icon';icon.textContent='▯';const copy=document.createElement('div');const b=document.createElement('b');b.textContent=d.name;const small=document.createElement('small');small.textContent='已保存配对关系';copy.append(b,small);row.append(icon,copy);$('devices').append(row)}
if(s.pairing_seconds>0){$('expiry').textContent=`配对码在 ${Math.ceil(s.pairing_seconds/60)} 分钟内有效`;if(!showing){$('qr').src='/pairing.svg?t='+Date.now();$('qr').style.display='block';showing=true}}else{$('expiry').textContent='配对码已使用或过期，可刷新以连接新设备';$('qr').style.display='none';showing=false}
$('jobs').replaceChildren();if(!s.jobs.length)$('jobs').textContent='扫描记录同步后，将出现在这里。';const stages={preparing:'检查扫描记录',features:'提取画面特征',matching:'关联不同视角',mapping:'恢复空间结构',undistorting:'准备训练画面',training:'生成三维场景',ready:'空间已生成，可在手机浏览',failed:'处理未完成，请查看诊断',input_verified:'扫描已接收'};for(const j of s.jobs){const item=document.createElement('div');item.className='row';item.textContent=j.state==='waiting_engine'?'扫描已接收 · 等待处理服务':stages[j.stage]||'等待处理';$('jobs').append(item)}if(s.training_ready)document.querySelector('.notice').innerHTML='录制视频默认保存在手机，仅同步精选视角。<br>电脑自动生成三维场景，手机缓存后可离线探索。'}catch{$('expiry').textContent='电脑服务暂不可用，请重新启动'}}
$('renew').onclick=async()=>{await fetch('/api/pairing',{method:'POST'});showing=false;refresh()};refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script></body></html>
