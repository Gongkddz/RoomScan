[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roomscan-server"
version = "0.1.0"
description = "Local-first spatial capture companion"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "zeroconf>=0.145,<1", "cryptography>=44", "psutil>=6,<8", "qrcode>=8,<9", "pycolmap==4.2.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
roomscan = "roomscan.cli:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
roomscan = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

